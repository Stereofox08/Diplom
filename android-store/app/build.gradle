plugins { id 'com.android.application' }
android {
    namespace 'kz.bytestore.shop'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'kz.bytestore.shop'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'kz.bytestore.shop.NativeChecks'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
// Optional local output directory for workspaces synced by cloud storage.
if (project.hasProperty('byteStoreBuildDir')) {
    layout.buildDirectory.set(file(project.property('byteStoreBuildDir')))
}
